name: CI

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      opencode: ${{ steps.filter.outputs.opencode }}
      claude-code: ${{ steps.filter.outputs.claude-code }}
      github-config: ${{ steps.filter.outputs.github-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            opencode:
              - 'harnesses/opencode/**'
            claude-code:
              - 'harnesses/claude-code/**'
            github-config:
              - '.github/**'
              - 'lefthook.yml'

  test-claude-code:
    needs: changes
    if: needs.changes.outputs.claude-code == 'true' || needs.changes.outputs.github-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test Īdisu engine
        run: cd harnesses/claude-code/cli/src/idisu && bun install && bun test && bun run typecheck
      - name: Test Rejion plugin
        run: cd harnesses/claude-code/plugins/rejion && bun install && bun test

