[project]
name = "opencode-finance-scripts"
version = "0.1.0"
description = "Deterministic local finance compute scripts for OpenCode Harness v2"
requires-python = ">=3.11"
dependencies = [
  "arelle-release>=2.37.27",
  "pandas>=2.2,<3",
  "pint>=0.24,<1",
  "pydantic>=2.8,<3",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
